[project]
name = "rag-pdf-chatbot"
version = "0.1.0"
description = "A Streamlit RAG chatbot for answering questions from uploaded PDFs with citations."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "RAG PDF Chatbot Contributors" },
]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "__pycache__",
  "chroma_db",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once at import; the B008 warning
# about function calls in argument defaults does not apply to them.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Query",
  "fastapi.Body",
  "fastapi.Header",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
